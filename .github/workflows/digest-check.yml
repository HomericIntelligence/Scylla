name: Check Python Digest Pins

on:
  schedule:
    # Run weekly on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

env:
  IMAGE_REPOSITORY: library/python
  IMAGE_TAG: 3.13-slim

jobs:
  check-python-digest:
    name: Check for stale python digest pins
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Get current pinned digest from Containerfile
        id: pinned
        run: |
          PINNED_DIGEST=$(grep -oP "FROM python:${{ env.IMAGE_TAG }}@sha256:\K[a-f0-9]{64}" ci/Containerfile | head -1)
          echo "digest=${PINNED_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Pinned digest: ${PINNED_DIGEST}"

      - name: Get latest digest from Docker Hub
        id: latest
        run: |
          # Anonymous registry GETs return a 401 JSON error body even for public
          # images, so fetch an anonymous bearer token first.
          TOKEN=$(curl -fsSL "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${{ env.IMAGE_REPOSITORY }}:pull" \
            | jq -r '.token')

          # The digest comparable to a FROM image@sha256 pin is the manifest-list /
          # OCI-index digest in the docker-content-digest RESPONSE header — never
          # .config.digest from the manifest body.
          LATEST_DIGEST=$(curl -fsSL -o /dev/null -w '%header{docker-content-digest}' \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.index.v1+json" \
            "https://registry-1.docker.io/v2/${{ env.IMAGE_REPOSITORY }}/manifests/${{ env.IMAGE_TAG }}" \
            | sed 's/^sha256://')

          # jq prints the literal STRING "null" on error JSON, which is non-empty
          # and would pass an emptiness-only check, so guard for it explicitly.
          if [ -z "$LATEST_DIGEST" ] || [ "$LATEST_DIGEST" = "null" ]; then
            echo "ERROR: Could not fetch latest digest from Docker Hub"
            exit 1
          fi

          echo "digest=${LATEST_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Latest digest: ${LATEST_DIGEST}"

      - name: Compare digests
        id: compare
        run: |
          PINNED="${{ steps.pinned.outputs.digest }}"
          LATEST="${{ steps.latest.outputs.digest }}"

          if [ -z "$PINNED" ] || [ "$PINNED" = "null" ]; then
            echo "ERROR: Could not extract pinned digest from Containerfile"
            exit 1
          fi

          if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
            echo "ERROR: Could not fetch latest digest from Docker Hub"
            exit 1
          fi

          if [ "$PINNED" = "$LATEST" ]; then
            echo "status=current" >> "$GITHUB_OUTPUT"
            echo "Digest is up to date"
          else
            echo "status=stale" >> "$GITHUB_OUTPUT"
            echo "Digest is stale"
          fi

      - name: Open issue if digest is stale
        if: steps.compare.outputs.status == 'stale'
        run: |
          LATEST_DIGEST="${{ steps.latest.outputs.digest }}"
          TAG="${{ env.IMAGE_TAG }}"
          EXISTING_ISSUE=$(gh issue list --search "update python:${TAG} digest in:title" --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING_ISSUE" ]; then
            echo "Updating existing issue #${EXISTING_ISSUE}"
            gh issue comment "${EXISTING_ISSUE}" --body "Digest check: Latest digest is ${LATEST_DIGEST}"
          else
            echo "Creating new issue for digest update"
            gh issue create --title "chore: update python:${TAG} digest pins" --body "The python:${TAG} digest pins need to be updated. Latest: ${LATEST_DIGEST}. Check ci/Containerfile and docker/Dockerfile."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report status
        run: |
          if [ "${{ steps.compare.outputs.status }}" = "current" ]; then
            echo "All digest pins are current"
          else
            echo "Digest pins are stale - issue opened or updated"
          fi
