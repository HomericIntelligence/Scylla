# Single source of truth for every status check that gates merges on `main`.
#
# The org ruleset `homeric-main-baseline` (NOT classic branch protection)
# requires these EXACT contexts. Each is produced by a job named identically
# below, all in THIS workflow so they share one concurrency group and one run:
#   - lint
#   - unit-tests
#   - integration-tests
#   - security/dependency-scan
#   - security/secrets-scan
#   - build
#   - schema-validation
#   - deps/version-sync
#
# These jobs previously lived in separate workflows (test.yml, pre-commit.yml,
# security.yml) under non-matching names (`test (unit, tests/unit)`,
# `Dependency vulnerability scan`, …), so the required contexts NEVER reported
# and every PR sat permanently BLOCKED. Consolidating here makes the emitted
# check names match the ruleset exactly. A prior attempt to bridge them via
# `workflow_call` failed because the called workflow shared a concurrency group
# and `cancel-in-progress` cancelled one of the two runs — inlining the job
# bodies removes that hazard entirely. Closes #2016.
#
# Toolchain: uv (Odysseus ADR-017; migrated from pixi + pip, mirroring
# HomericIntelligence/Hephaestus#2236). Each job sets up uv via
# astral-sh/setup-uv and installs the locked environment with
# `uv sync --all-groups --all-extras --locked`, then runs tools via `uv run`.
name: Required Checks

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Cancel superseded commits for one PR, while keeping pull-request and
# synthetic merge-group validations in separate event-scoped groups.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 0. forbid-suppressions ─────────────────────────────────────────────────
  # Regression guard for HomericIntelligence/Odysseus#280: rejects `|| true`
  # and `continue-on-error: true` in shell/YAML/Dockerfile/justfile/HCL files
  # and in GitHub Actions workflows. Refactor to an explicit `if`-guard, a
  # real conditional, or a documented `set +e`/`set -e` bracket.
  forbid-suppressions:
    name: forbid-suppressions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: "Reject silent-failure workaround in shell/YAML/Dockerfile/justfile/HCL"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files \
            -- \
            '*.sh' '*.bash' '*.yml' '*.yaml' '*.hcl' \
            'Dockerfile*' '**/Dockerfile*' \
            'justfile' '**/justfile' 'Justfile' '**/Justfile')
          declare -a scan_files=()
          for f in "${files[@]}"; do
            case "$f" in
              # Exempt this workflow file (heredoc would otherwise self-match)
              .github/workflows/_required.yml) continue ;;
              # Exempt any runbook that documents the rule (if present)
              docs/runbooks/no-silent-failures.md) continue ;;
            esac
            scan_files+=("$f")
          done
          if [ "${#scan_files[@]}" -eq 0 ]; then
            echo "No files to scan"
            exit 0
          fi
          if grep -nE '\|\|[[:space:]]*true([[:space:]]*$|[[:space:]]+#)' "${scan_files[@]}"; then
            echo ""
            echo '::error::Found silent-failure workarounds above. Refactor per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no silent-failure workarounds found'

      - name: "Reject continue-on-error workflow opt-out"
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No workflow files"
            exit 0
          fi
          if grep -nE '^[[:space:]]*continue-on-error:[[:space:]]*true[[:space:]]*$' "${files[@]}"; then
            echo ""
            echo '::error::Found "continue-on-error: true" above.'
            echo '::error::Fix the root cause per HomericIntelligence/Odysseus#280.'
            exit 1
          fi
          echo 'OK: no "continue-on-error: true" found'

  # ── 1. lint ────────────────────────────────────────────────────────────────
  # Emits the required `lint` context. Body inlined from the former
  # pre-commit.yml (deleted in this change) so it runs exactly once, in this
  # workflow's single concurrency group.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      # Pre-commit (with baked hook envs), ruff C901, mypy, and lint-imports
      # all run inside the CI container — the same image developers use via
      # `just ci-lint`.
      - name: Lint (in container)
        run: bash scripts/run_ci_local.sh lint

      - name: Upload pre-commit diff
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pre-commit-diffs
          retention-days: 7
          path: |
            .git/pre-commit-*
  unit-tests:
    name: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      # Deprecated-symbol guards, uv.lock sync, consistency scripts,
      # structure conventions, config schema validation, complexity gate,
      # import-linter, and the pytest unit suite (75% coverage floor) all run
      # inside the CI container.
      - name: Unit tests (in container)
        run: bash scripts/run_ci_local.sh unit

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: ./coverage.xml
          flags: unit
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-results-unit
          path: |
            coverage.xml
            junit-unit.xml
          retention-days: 7
  integration-tests:
    name: integration-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      # nats-server v2.10.24 is baked into the CI image (pinned,
      # sha256-checked in ci/Containerfile) — the integration fixtures spawn it
      # from PATH exactly as the native job did after its curl install step.
      - name: Integration tests (in container)
        run: bash scripts/run_ci_local.sh integration

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: test-results-integration
          path: |
            coverage.xml
            junit-integration.xml
          retention-days: 7
  security-dependency-scan:
    name: security/dependency-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      - name: Run pip-audit (in container)
        id: pip-audit
        run: bash scripts/run_ci_local.sh security

      - name: Post pip-audit summary
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.pip-audit.outcome }}
        run: |
          {
            echo "## pip-audit Security Scan"
            echo ""
            if [ "$AUDIT_OUTCOME" = "success" ]; then
              echo "No HIGH/CRITICAL vulnerabilities found."
            else
              echo "Vulnerabilities detected — see job logs for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
  security-secrets-scan:
    name: security/secrets-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Full history checkout so gitleaks can scan all commits, not just HEAD.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
        with:
          fetch-depth: 0

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      # Gitleaks 8.30.1 is pinned in ci/Containerfile (same version the
      # native job downloaded; scripts/check_ci_version_sync.py asserts the
      # config files agree). Scanning is strict (default --exit-code 1).
      - name: Run Gitleaks (in container)
        run: bash scripts/run_ci_local.sh secrets
  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Validate Dockerfile syntax
        run: |
          # Validate all Dockerfiles in the repo using docker build --check (BuildKit dry-run)
          find . -name "Dockerfile*" \
            -not -path "./.venv/*" \
            -not -path "./docker/*" \
            | sort | while read -r df; do
              echo "Checking $df ..."
              docker build --check -f "$df" . || exit 1
            done
          # Also check docker/ subdirectory Dockerfiles independently
          find ./docker -name "Dockerfile*" 2>/dev/null | sort | while read -r df; do
            echo "Checking $df ..."
            docker build --check -f "$df" ./docker || exit 1
          done

      - name: Install locked build environment
        run: |
          # The 'build' frontend and hatchling backend are in [dependency-groups].dev;
          # --no-isolation then builds against the synced environment.
          uv sync --all-groups --all-extras --locked

      - name: Build Python package (sdist + wheel)
        run: |
          uv run python -m build --no-isolation
          ls -lh dist/

      - name: Upload built distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: python-package
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ── 6a. test (aggregate) ───────────────────────────────────────────────────
  # Canonical 8-category `test` context. Aggregates the discrete suites
  # (`unit-tests`, `integration-tests`) into a single roll-up so the Odysseus
  # ecosystem board can show one clear `test` category while the per-suite
  # checks remain visible. Pure fan-in: no test work of its own, just gates on
  # the suites it `needs:`. Canonical CI naming (HomericIntelligence/Odysseus).
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, integration-tests]
    steps:
      - name: Aggregate test result
        run: echo "All required test suites (unit-tests, integration-tests) passed."

  # ── 6b. package ────────────────────────────────────────────────────────────
  # Canonical 8-category `package` context. Verifies the distributable
  # artifacts produced by `build` are well-formed (twine check on the sdist +
  # wheel). Consumes the `python-package` artifact so it does no rebuild.
  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          enable-cache: true

      - name: Install locked project environment
        run: uv sync --all-groups --all-extras --locked

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Validate distribution metadata (twine check)
        run: uv run twine check dist/*

  # ── 6c. install ────────────────────────────────────────────────────────────
  # Canonical 8-category `install` context. Installs the built wheel into a
  # clean venv and smoke-tests the `scylla` console entry point, proving the
  # package is installable end-to-end (not just buildable).
  install:
    name: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13"

      - name: Download built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: python-package
          path: dist/

      - name: Install wheel into clean venv
        run: |
          python -m venv /tmp/scylla-install-venv
          /tmp/scylla-install-venv/bin/pip install --upgrade pip
          # Install the built wheel (not the source tree) to prove the package
          # installs from its distributable artifact.
          wheel=$(ls dist/*.whl | head -1)
          echo "Installing ${wheel}"
          /tmp/scylla-install-venv/bin/pip install "${wheel}"

      - name: Smoke-test console entry point
        run: |
          /tmp/scylla-install-venv/bin/scylla --help
          /tmp/scylla-install-venv/bin/python -c "import scylla; print('scylla', getattr(scylla, '__version__', 'imported'))"

  # ── 7. schema-validation ───────────────────────────────────────────────────
  schema-validation:
    name: schema-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      - name: Validate schemas (in container)
        run: bash scripts/run_ci_local.sh schema
  deps-version-sync:
    name: deps/version-sync
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      # Package version single-source-of-truth, CI-tooling version sync,
      # and uv.lock sync — all inside the CI container.
      - name: Check version sync (in container)
        run: bash scripts/run_ci_local.sh deps
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v20.0.0
        # Globs and rule config come from .markdownlint-cli2.yaml at repo root,
        # which is the same file pre-commit reads — keeps CI and local in sync.
        with:
          globs: "**/*.md"

  # ── 10. uv-lock-check ──────────────────────────────────────────────────────
  # Replaces the former pixi-check job (removed with the pixi→uv migration,
  # ADR-017). pixi-check was NOT a required ruleset context, so removing it does
  # not affect the merge queue. This job proves the locked uv environment
  # resolves and installs cleanly, mirroring HomericIntelligence/Hephaestus#2236.
  uv-lock-check:
    name: uv-lock-check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Cache podman container storage
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v5
        with:
          path: ~/.local/share/containers/storage
          key: podman-scylla-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock', '.pre-commit-config.yaml') }}
          restore-keys: |
            podman-scylla-${{ runner.os }}-

      - name: Build CI image (podman)
        run: podman build -f ci/Containerfile -t scylla-ci:local .
      - name: Check uv.lock is in sync (in container)
        run: |
          podman run --rm --userns=keep-id -v "$PWD:/workspace:Z" -w /workspace scylla-ci:local \
            sh -c 'uv lock --check && uv sync --all-groups --all-extras --locked'
  justfile-check:
    name: justfile-check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Skip if no justfile
        id: detect
        run: |
          if [ ! -f justfile ] && [ ! -f Justfile ]; then
            echo "::notice::No justfile in repo, skipping justfile-check"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Install just
        if: steps.detect.outputs.skip == 'false'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0
        with:
          just-version: "1.36.0"
      - name: Validate justfile
        if: steps.detect.outputs.skip == 'false'
        run: |
          just --evaluate >/dev/null
          just --list >/dev/null

  # ── 12. symlink-check ──────────────────────────────────────────────────────
  symlink-check:
    name: symlink-check
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run symlink check
        run: bash scripts/check-symlinks.sh
